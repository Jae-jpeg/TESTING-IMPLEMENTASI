<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - Mother Nature</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f3f7f0;
            color: #263b2a;
            display: flex;
            flex-direction: column;
        }

        .register-header {
            padding: 20px 7%;
            background: white;
            border-bottom: 1px solid #e2e9df;
        }

        .register-header a {
            color: #2f6b3d;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
        }

        .register-container {
            width: 100%;
            max-width: 460px;
            margin: 40px auto;
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 5px 24px rgba(35, 65, 39, 0.08);
        }

        .register-container h1 {
            margin: 0 0 8px;
            font-size: 28px;
            text-align: center;
        }

        .register-description {
            margin: 0 0 25px;
            color: #68766a;
            text-align: center;
            line-height: 1.5;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #cbd7c9;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #43834e;
            box-shadow: 0 0 0 3px rgba(67, 131, 78, 0.12);
        }

        .register-button {
            width: 100%;
            padding: 13px;
            margin-top: 5px;
            border: none;
            border-radius: 8px;
            background: #347443;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-button:hover {
            background: #285d35;
        }

        .register-message {
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
        }

        .login-link {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        .login-link a {
            color: #347443;
            font-weight: bold;
            text-decoration: none;
        }

        .back-link {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #68766a;
            font-size: 13px;
            text-decoration: none;
        }

        @media (max-width: 520px) {
            .register-container {
                margin: 24px 16px;
                padding: 24px 20px;
            }
        }
    </style>
</head>

<body>
    <header class="register-header">
        <a href="index.html">Mother Nature</a>
    </header>

    <main class="register-container">
        <h1>Buat Akun</h1>
        <p class="register-description">
            Daftar terlebih dahulu agar kamu bisa melakukan pemesanan pupuk dengan lebih mudah.
        </p>

        <form id="registerForm">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input
                    type="text"
                    id="nama"
                    name="nama"
                    placeholder="Masukkan nama lengkap"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="nama@email.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="telepon">Nomor Telepon</label>
                <input
                    type="tel"
                    id="telepon"
                    name="telepon"
                    placeholder="Masukkan nomor telepon"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Kata Sandi</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Minimal 6 karakter"
                    minlength="6"
                    required
                >
            </div>

            <div class="form-group">
                <label for="konfirmasiPassword">Konfirmasi Kata Sandi</label>
                <input
                    type="password"
                    id="konfirmasiPassword"
                    name="konfirmasiPassword"
                    placeholder="Masukkan ulang kata sandi"
                    minlength="6"
                    required
                >
            </div>

            <button type="submit" class="register-button">
                Daftar Sekarang
            </button>

            <p id="registerMessage" class="register-message" role="status"></p>
        </form>

        <p class="login-link">
            Sudah punya akun? <a href="login.html">Masuk di sini</a>
        </p>

        <a href="index.html" class="back-link">← Kembali ke halaman utama</a>
    </main>

    <script src="../js/akun.js"></script>
</body>
</html>
