<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - Mother Nature</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tailwind-output.css">
</head>
<body>

    <main>
        <h1>Daftar Akun Customer</h1>
        <p>Buat akun untuk mempermudah pemesanan pupuk.</p>

        <form id="formRegister">
            <div>
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" required>
            </div>

            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div>
                <label for="telepon">Nomor Telepon</label>
                <input type="tel" id="telepon" name="telepon" required>
            </div>

            <div>
                <label for="alamat">Alamat</label>
                <textarea id="alamat" name="alamat" required></textarea>
            </div>

            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="6">
            </div>

            <div>
                <label for="konfirmasiPassword">Konfirmasi Password</label>
                <input type="password" id="konfirmasiPassword"
                       name="konfirmasiPassword" required minlength="6">
            </div>

            <button type="submit">Daftar</button>
        </form>

        <p id="pesan"></p>

        <p>
            Sudah punya akun?
            <a href="login.html">Login di sini</a>
        </p>

        <p><a href="index.html">Kembali ke Beranda</a></p>
    </main>

    <script src="../js/akun.js"></script>
</body>
</html>
